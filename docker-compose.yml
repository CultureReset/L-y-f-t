# The platform with a real database behind it.
#
#   docker compose up
#
# Brings up PostgreSQL and the API. The apps run on your machine and point at
# http://localhost:4000, which is where they look by default.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: lift
      POSTGRES_USER: lift
      POSTGRES_DB: lift
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lift']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      STORE: postgres
      DATABASE_URL: postgresql://lift:lift@postgres:5432/lift
      # Everything below has a working default; these are here to be changed.
      GEO_PROVIDER: mock
      DISPATCH_STRATEGY: scored
      SURGE_PROVIDER: flat
      SEED_ON_BOOT: 'true'
    ports:
      - '4000:4000'
    command: npm run start -w @lift/api

volumes:
  postgres-data:
